<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GURU MATCH - Professional Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans">

    <!-- Navigation -->
    <nav class="bg-white p-4 shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black text-blue-600">GURU MATCH</h1>
            <div class="space-x-4 text-sm font-bold">
                <a href="#studentsDirectory" class="text-slate-600">PROFILES</a>
                <a href="#studentReg" class="text-slate-600">STUDENT REG</a>
                <a href="#tutorReg" class="text-slate-600">TUTOR REG</a>
            </div>
        </div>
    </nav>

    <!-- Profiles Section -->
    <section id="studentsDirectory" class="max-w-6xl mx-auto py-12 px-4">
        <h2 class="text-3xl font-black mb-8">Student Profiles Directory</h2>
        <div id="studentGridContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        <div class="mt-8 text-center">
            <button onclick="alert('Loading more from database...')" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold">MORE PROFILES</button>
        </div>
    </section>

    <!-- Registration Forms -->
    <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-8 py-12 px-4">
        <!-- Student Form -->
        <div id="studentReg" class="bg-white p-8 rounded-3xl shadow-sm border">
            <h2 class="text-2xl font-black mb-6">Student Registration</h2>
            <form onsubmit="registerStudent(event)" class="space-y-4">
                <input type="text" id="sName" placeholder="Full Name" class="w-full p-3 border rounded-xl" required>
                <input type="text" id="sStream" placeholder="Stream (Arts/Science/Commerce)" class="w-full p-3 border rounded-xl" required>
                <input type="tel" id="sPhone" placeholder="Phone Number" class="w-full p-3 border rounded-xl" required>
                <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold">REGISTER AS STUDENT</button>
            </form>
        </div>
        <!-- Tutor Form -->
        <div id="tutorReg" class="bg-white p-8 rounded-3xl shadow-sm border">
            <h2 class="text-2xl font-black mb-6">Tutor Registration</h2>
            <form class="space-y-4">
                <input type="text" placeholder="Tutor Name" class="w-full p-3 border rounded-xl">
                <input type="text" placeholder="Subject Expertise" class="w-full p-3 border rounded-xl">
                <button type="button" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">JOIN AS TUTOR</button>
            </form>
        </div>
    </div>

    <!-- Contact Modal -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-[99]">
        <div class="bg-white p-8 rounded-3xl max-w-sm w-full">
            <h3 class="font-bold text-lg mb-4">Contact Student</h3>
            <p id="modalMsg" class="text-sm text-slate-500 mb-4"></p>
            <input type="password" id="tutorCode" placeholder="Enter Tutor Code" class="w-full p-3 border rounded-xl mb-4">
            <button onclick="revealContact()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">UNLOCK CONTACT</button>
            <button onclick="document.getElementById('modal').classList.add('hidden')" class="w-full mt-2 text-slate-400">Close</button>
        </div>
    </div>

    <script>
        let liveStudents = JSON.parse(localStorage.getItem('liveStudents') || '[]');
        const sampleProfiles = [
            {name: "Ahmad Faisal", stream: "Arts", phone: null},
            {name: "Zaid Khan", stream: "Science", phone: null},
            {name: "Fatima Shaikh", stream: "Commerce", phone: null}
        ];

        function render() {
            const container = document.getElementById('studentGridContainer');
            container.innerHTML = '';
            const all = [...liveStudents, ...sampleProfiles].sort(() => Math.random() - 0.5);
            
            all.forEach(s => {
                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-2xl border shadow-sm";
                card.innerHTML = `
                    <h3 class="font-bold text-lg">${s.name}</h3>
                    <p class="text-sm text-blue-600 mb-4">${s.stream}</p>
                    <button onclick="openModal('${s.phone}', ${!!s.phone})" class="w-full border border-blue-600 text-blue-600 py-2 rounded-lg font-bold text-xs">CONTACT STUDENT</button>
                `;
                container.appendChild(card);
            });
        }

        function registerStudent(e) {
            e.preventDefault();
            const newS = {
                name: document.getElementById('sName').value,
                stream: document.getElementById('sStream').value,
                phone: document.getElementById('sPhone').value
            };
            liveStudents.push(newS);
            localStorage.setItem('liveStudents', JSON.stringify(liveStudents));
            alert("Registered successfully!");
            render();
        }

        function openModal(phone, isReal) {
            document.getElementById('modal').classList.remove('hidden');
            window.targetPhone = phone;
            document.getElementById('modalMsg').innerText = isReal ? "Enter code to see number" : "This is a sample profile. Real numbers only for live registrations.";
        }

        function revealContact() {
            const code = document.getElementById('tutorCode').value;
            if(code && window.targetPhone) {
                alert("Phone: " + window.targetPhone);
            } else {
                alert("Invalid code or no real number available.");
            }
        }

        render();
    </script>
</body>
</html>
