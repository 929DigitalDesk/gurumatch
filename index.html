<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure UPI Payment Gateway</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --car-green: #008f39;
            --car-green-hover: #00722d;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .gateway-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .gateway-header {
            background: #f8fafc;
            padding: 24px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .gateway-header h2 {
            font-size: 20px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 4px;
        }

        .gateway-header p {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .gateway-body {
            padding: 24px;
            text-align: center;
        }

        .amount-display {
            font-size: 36px;
            font-weight: 800;
            color: var(--car-green);
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
        }

        .amount-display span {
            font-size: 24px;
            color: var(--text-muted);
        }

        .qr-wrapper {
            background: #ffffff;
            padding: 16px;
            border-radius: 12px;
            border: 2px dashed #cbd5e1;
            display: inline-block;
            margin-bottom: 24px;
            transition: border-color 0.3s;
        }
        
        .qr-wrapper:hover {
            border-color: var(--car-green);
        }

        #qrCodeImage {
            width: 180px;
            height: 180px;
            display: block;
        }

        .upi-btn {
            display: block;
            width: 100%;
            background: var(--car-green);
            color: #ffffff;
            padding: 16px;
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(0, 143, 57, 0.25);
            transition: all 0.2s ease;
            margin-bottom: 16px;
        }

        .upi-btn:hover { 
            background: var(--car-green-hover); 
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 143, 57, 0.35);
        }

        .upi-btn:active {
            transform: translateY(0);
        }

        .instruction {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .manual-input-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 20px;
            text-align: left;
        }

        .manual-input-group label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .manual-input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        .manual-input-group input:focus {
            border-color: var(--car-green);
            box-shadow: 0 0 0 3px rgba(0, 143, 57, 0.1);
        }
        
        .footer-note {
            background: #f8fafc;
            padding: 16px;
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="gateway-card">
        <div class="gateway-header">
            <h2>929 Digital Desk</h2>
            <p>Secure UPI Payment Gateway</p>
        </div>
        
        <div class="gateway-body">
            
            <div class="manual-input-group" id="amountInputGroup" style="display: none;">
                <label for="customAmount">Enter Amount (₹)</label>
                <input type="number" id="customAmount" placeholder="e.g. 500" value="500" oninput="generatePaymentLinks()">
            </div>

            <div class="amount-display" id="fixedAmountDisplay">
                <span>₹</span><span id="displayAmount">0</span>
            </div>
            
            <p class="instruction">Scan with any UPI app (GPay, PhonePe, Paytm) or tap the button below if you are on mobile.</p>

            <div class="qr-wrapper">
                <img id="qrCodeImage" src="" alt="UPI QR Code Loading...">
            </div>

            <a href="#" id="upiPaymentBtn" class="upi-btn">Pay via Mobile UPI App</a>
        </div>
        
        <div class="footer-note">
            100% Secure & Encrypted Transaction. Powered by UPI.
        </div>
    </div>

    <script>
        // CONFIGURATION: Enter your actual UPI details here
        const UPI_ID = "verizon@upi"; 
        const PAYEE_NAME = "929 Digital Desk";
        const DEFAULT_AMOUNT = "500"; // Fallback amount

        // Function to grab URL parameters (Perfect for JotForm redirects)
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        function generatePaymentLinks() {
            let amount = getQueryParam('amount');
            const customAmountInput = document.getElementById('customAmount');
            const displayAmount = document.getElementById('displayAmount');
            const amountInputGroup = document.getElementById('amountInputGroup');
            const fixedAmountDisplay = document.getElementById('fixedAmountDisplay');
            
            // Logic: If JotForm passes '?amount=500' in URL, lock it. 
            // If no amount is in URL, show a manual input box.
            if (amount) {
                // Read-only mode based on URL
                displayAmount.innerText = amount;
                amountInputGroup.style.display = 'none';
                fixedAmountDisplay.style.display = 'flex';
            } else {
                // Manual input mode
                amount = customAmountInput.value || DEFAULT_AMOUNT;
                amountInputGroup.style.display = 'flex';
                fixedAmountDisplay.style.display = 'none';
            }

            // Create standard UPI URI scheme
            const upiString = `upi://pay?pa=${UPI_ID}&pn=${encodeURIComponent(PAYEE_NAME)}&cu=INR&am=${amount}`;
            
            // Update Deep Link Button
            const upiBtn = document.getElementById("upiPaymentBtn");
            upiBtn.href = upiString;
            upiBtn.innerHTML = `📲 Pay ₹${amount} via UPI App`;
            
            // Update QR Code Image using API
            const qrImage = document.getElementById("qrCodeImage");
            qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&margin=10&data=${encodeURIComponent(upiString)}`;
        }

        // Initialize on page load
        window.onload = generatePaymentLinks;
    </script>
</body>
</html>
