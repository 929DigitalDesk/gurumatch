<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guru Match - Student Profiles</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
    }
    .stream-title {
      color: #16a085;
      border-bottom: 2px solid #16a085;
      padding-bottom: 5px;
      margin-top: 40px;
      font-size: 22px;
    }
    .card-container {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 15px;
    }
    .student-card {
      background: #ffffff;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      width: calc(33.333% - 20px);
      box-sizing: border-box;
    }
    .student-card h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
      color: #34495e;
      line-height: 1.4;
    }
    .student-card p {
      margin: 0;
      font-size: 14px;
      color: #7f8c8d;
    }
    /* Mobile responsive ke liye */
    @media (max-width: 768px) {
      .student-card {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <h1>Guru Match - Student Profiles Directory</h1>
  <div id="directory"></div>

  <script>
    const studentData = [
      {
        "stream": "Arts",
        "students": [
          { "name": "AHMAD MOHD FAISAL MOHD FAIYYAZ AHMAD", "phone": "88104****" },
          { "name": "ANSARI MARIYAM RIYASATALI KHUSHNUDA", "phone": "93725****" },
          { "name": "ANSARI SAIF SHAHEED SALMA PARWEEN", "phone": "84548****" },
          { "name": "BIZAL SUNEERA RIYAZ AYESHA BIZAL", "phone": "98333****" },
          { "name": "FERNANDES JOHNATHIN JOEL JOYCE", "phone": "91675****" }
        ]
      },
      {
        "stream": "Science",
        "students": [
          { "name": "AGA FALAK NAAZ ASIF HAMIDA", "phone": "98670****" },
          { "name": "ANSARI BUSHRA BANO ABDUL HAKEEM ANISA", "phone": "91529****" },
          { "name": "ANSARI MOHAMMED ARSALAN SHABNAM", "phone": "85911****" },
          { "name": "GUPTA SIDDHANT PANNALAL SUMAN", "phone": "93218****" }
        ]
      },
      {
        "stream": "Commerce",
        "students": [
          { "name": "AGRAHARI SEJAL BANARSILAL KALPANA", "phone": "87792****" },
          { "name": "AHMED AHANA NAZEER RUKSHANA NAZEER WAGU", "phone": "91522****" },
          { "name": "ALI KHIZRA SHABBIR SALMA", "phone": "90049****" },
          { "name": "ANSARI AAMAN KALIM JAHARA", "phone": "88798****" }
        ]
      }
    ];

    const directoryDiv = document.getElementById('directory');

    studentData.forEach(group => {
      const heading = document.createElement('h2');
      heading.className = 'stream-title';
      heading.textContent = `${group.stream} Stream`;
      directoryDiv.appendChild(heading);

      const grid = document.createElement('div');
      grid.className = 'card-container';

      group.students.forEach(student => {
        const card = document.createElement('div');
        card.className = 'student-card';
        card.innerHTML = `
          <h3>${student.name}</h3>
          <p>Contact: <strong>${student.phone}</strong></p>
        `;
        grid.appendChild(card);
      });

      directoryDiv.appendChild(grid);
    });
  </script>

</body>
</html>
