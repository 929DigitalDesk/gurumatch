<!-- NEW: EMAIL BASED STAFF LOGIN MODAL -->
<div id="staffLoginModal" class="fixed inset-0 bg-slate-900/75 backdrop-blur-md z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 border border-slate-200 relative">
        <button onclick="closeStaffLoginModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
        <div class="text-center mb-4">
            <div class="w-12 h-12 bg-blue-100 text-brand-blue rounded-2xl flex items-center justify-center mx-auto mb-2 text-xl font-bold">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h3 class="text-xl font-black text-brand-dark">Staff / Admin Login</h3>
            <p class="text-xs text-slate-500 mt-1">Login with your official email address.</p>
        </div>
        <form onsubmit="handleStaffLogin(event)" class="space-y-3">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Staff Email *</label>
                <input type="email" id="staffEmailInput" required placeholder="admin@gurumatch.com" class="w-full border border-slate-300 rounded-xl p-3 text-xs font-bold bg-white focus:outline-none focus:border-brand-blue">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Password *</label>
                <input type="password" id="staffPassInput" required placeholder="••••••••" class="w-full border border-slate-300 rounded-xl p-3 text-xs font-bold bg-white focus:outline-none focus:border-brand-blue">
            </div>
            <button type="submit" class="w-full bg-brand-blue hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-md text-xs tracking-wider">
                LOGIN AS STAFF
            </button>
        </form>
    </div>
</div>
